# M2: Complex CGAN without phase loss (lambda_phase = 0).
name: M2_ComplexCGAN_NoPhase
seed: 0          # set before building the networks
split_seed: 0    # seed of the 90/10 train/validation split (per B-scan); null = unseeded (original script)
val_fraction: 0.1

data:
  folders: [phase]
  files:
    - Human_fingertip_skin.npy
    - Human_nail_plate.npy
    - Chicken_thigh_tissue.npy
    - fovea.npy
    - perifovea.npy
    - macula.npy
    - optic_nerve.npy

training:
  epochs: 300
  batch_size: 32
  lr_g: 3.0e-5
  lr_d: 5.0e-6
  betas: [0.5, 0.999]
  adversarial_loss: hinge
  lambda_l1: 100.0
  lambda_amp: 5.0
  lambda_phase: 0.0
  phase_weight_mode: none
  use_phase_grad: false
  lambda_phase_grad: 0.0
  use_ema: true
  ema_decay: 0.999
  grad_clip: 1.0
  scheduler:
    patience: 15
    factor: 0.5
    min_lr: 1.0e-7
  checkpoint_every: 5
  image_log_every: 25
